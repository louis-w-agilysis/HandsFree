# Archives, signs, and uploads the app to TestFlight. Manually triggered, not run on
# every push — an actual release step, not a check.
#
# INACTIVE until you've completed Apple Developer Program enrollment and added these
# repo secrets (Settings → Secrets and variables → Actions):
#
#   APPSTORE_ISSUER_ID        App Store Connect → Users and Access → Integrations →
#                              App Store Connect API → the "Issuer ID" at the top.
#   APPSTORE_API_KEY_ID       Same page → the Key ID of an API key you generate there
#                              (role: App Manager is enough).
#   APPSTORE_API_PRIVATE_KEY  The contents of the .p8 file downloaded when you
#                              generated that key (you only get to download it once).
#   IOS_DIST_CERT_P12         Your iOS Distribution certificate + private key,
#                              exported from Keychain Access as a .p12, base64-encoded
#                              (e.g. `base64 -i cert.p12 | pbcopy` on a Mac, or via a
#                              rented cloud Mac session — see docs/dev-workflow.md).
#   IOS_DIST_CERT_PASSWORD    The password you set when exporting that .p12.
#
# Until those exist, run ios-build.yml instead — that one works today with no Apple
# account at all. See docs/dev-workflow.md for the full picture.
name: iOS TestFlight release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Download provisioning profile
        uses: apple-actions/download-provisioning-profiles@v3
        with:
          bundle-id: com.louiswoolsey.handsfree
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -project HandsFree.xcodeproj \
            -scheme HandsFree \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/HandsFree.xcarchive \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/HandsFree.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ios/build/export/HandsFree.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
