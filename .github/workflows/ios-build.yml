# Compile-check for the iOS app on every push. No signing, no Apple Developer account
# needed — just proof the Swift actually builds, since there's no local Mac to check
# this on. See docs/dev-workflow.md for why this is split from ios-testflight.yml.
name: iOS build check

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write placeholder Secrets.swift
        # This workflow only compile-checks against the Simulator and never talks to
        # the real backend, so a placeholder value is fine here — see
        # ios-sideload-build.yml for the real secret. Secrets.swift is git-ignored
        # (see Secrets.swift.example), so it must exist before xcodegen runs or the
        # build fails on a missing source file.
        run: |
          cat > ios/Sources/HandsFree/Assistant/Secrets.swift <<'EOF'
          enum Secrets {
              static let clientSharedSecret = "ci-placeholder"
          }
          EOF

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for Simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project HandsFree.xcodeproj \
            -scheme HandsFree \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
