# Builds an unsigned device (iphoneos) .ipa and uploads it as a workflow artifact.
# Download it from this run's Summary page and install it via SideStore
# (docs.sidestore.io) — SideStore re-signs it with your own free Apple ID, so it
# does NOT need to be signed here. This is the standing release path — see
# docs/dev-workflow.md for why TestFlight (ios-testflight.yml) isn't currently needed.
name: iOS sideload build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Secrets.swift
        # Secrets.swift is git-ignored (see Secrets.swift.example) -- this is the real
        # release path, so it needs the actual secret, matching what's set on the
        # deployed Worker (backend/README.md), not the ios-build.yml placeholder.
        env:
          CLIENT_SHARED_SECRET: ${{ secrets.HANDSFREE_CLIENT_SECRET }}
        run: |
          cat > ios/Sources/HandsFree/Assistant/Secrets.swift <<EOF
          enum Secrets {
              static let clientSharedSecret = "$CLIENT_SHARED_SECRET"
          }
          EOF

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned for device
        working-directory: ios
        run: |
          xcodebuild build \
            -project HandsFree.xcodeproj \
            -scheme HandsFree \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package as versioned .ipa
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/HandsFree.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist")
          NAME="HandsFree-v${VERSION}-${BUILD}"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "$NAME.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ios/${{ env.IPA_NAME }}.ipa
