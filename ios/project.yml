name: HandsFree
options:
  bundleIdPrefix: com.louiswoolsey
  deploymentTarget:
    iOS: "17.0"
targets:
  HandsFree:
    type: application
    platform: iOS
    sources:
      - path: Sources/HandsFree
        excludes:
          - "**/*.example"
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "HandsFree listens for your voice commands, including a wake word, while you're driving."
        NSSpeechRecognitionUsageDescription: "HandsFree transcribes your voice commands on-device."
        NSRemindersFullAccessUsageDescription: "HandsFree creates reminders when you ask it to."
        UILaunchScreen: {}
        # Set directly as literal Info.plist values rather than via the
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION build settings -- those did not
        # propagate through XcodeGen as expected (confirmed via CI logs: neither
        # setting appeared anywhere in the actual xcodebuild output, and the built
        # Info.plist always had "1.0"/"1" regardless of what was set). This is more
        # direct and unambiguous. Bump both for each meaningful change so Louis can
        # tell builds apart on-device (ContentView) and in the CI artifact filename
        # (ios-sideload-build.yml reads these) -- see docs/decisions.md.
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louiswoolsey.handsfree
        SWIFT_VERSION: "5.0"
