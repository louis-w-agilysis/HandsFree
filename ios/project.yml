name: HandsFree
options:
  bundleIdPrefix: com.louiswoolsey
  deploymentTarget:
    iOS: "17.0"
targets:
  HandsFree:
    type: application
    platform: iOS
    sources:
      - Sources/HandsFree
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: "HandsFree listens for your voice commands, including a wake word, while you're driving."
        NSSpeechRecognitionUsageDescription: "HandsFree transcribes your voice commands on-device."
        NSRemindersFullAccessUsageDescription: "HandsFree creates reminders when you ask it to."
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louiswoolsey.handsfree
        SWIFT_VERSION: "5.0"
        # Bump MARKETING_VERSION for each meaningful change so Louis can tell builds
        # apart on-device (shown in ContentView) and in the CI artifact filename
        # (ios-sideload-build.yml reads this same value) -- see docs/decisions.md.
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
